<!doctype html>
<!-- MAQUETTE UX UNIQUEMENT, PAS DE DESIGN : ordre des écrans, infos demandées et actions possibles. Ne rien reprendre de l'apparence (couleurs, tailles, espacements, composants) : tout se fait avec la direction artistique et les composants actuels de l'appli Prospectigo. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Résultats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f7f5f2}
a{color:#2626d6;text-decoration:none}a:hover{color:#1a1aa8}
.navi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#736f6c;text-decoration:none}
.navi.on{background:#e9e9ff;color:#2626d6}
.steps{display:flex;flex-wrap:wrap;gap:4px;font-size:13px}
.steps a{padding:6px 12px;border-radius:999px;color:#9a958f;font-weight:500}
.steps a.on{background:#e9e9ff;color:#2626d6}
.steps a.done{color:#47423d}
.kpi{flex:1 1 160px;display:flex;flex-direction:column;gap:2px}
.kpi strong{font-size:40px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:14px;color:#736f6c}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:999px;background:#efece6}
.seg button{min-height:34px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:500 13px Inter,system-ui,sans-serif;color:#47423d;cursor:pointer}
.seg button.on{background:#fff;color:#1a1a1a;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
button:focus-visible,a:focus-visible{outline:2px solid #3d3dff;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 900px; display: flex; font-family: Inter, system-ui, sans-serif; color: #1a1a1a; background: #f7f5f2;">
  <nav aria-label="Menu" style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 18px; background: #fff; border-right: 1px solid #f0ede8;">
    <div style="width: 34px; height: 34px; border-radius: 10px; background: #3d3dff; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px;" aria-label="Prospectigo">P</div>
    <a class="navi on" href="Main.dc.html" aria-label="Campagnes" title="Campagnes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"></path></svg></a>
    <a class="navi" href="Entreprises.dc.html" aria-label="Prospects" title="Prospects"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 4v16"></path></svg></a>
    <a class="navi" href="Message.dc.html" aria-label="Réglages" title="Réglages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></a>
  </nav>

  <main style="flex: 1 1 auto; min-width: 0; padding: 24px 16px 64px;">
    <div style="max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">
      <div class="steps" aria-label="Étapes">
        <a class="done" href="Main.dc.html">1 · Qui ?</a>
        <a class="done" href="Entreprises.dc.html">2 · Entreprises</a>
        <a class="done" href="Message.dc.html">3 · Message</a>
        <a class="done" href="Envoi.dc.html">4 · Envoi</a>
        <a class="on" href="Resultats.dc.html">5 · Résultats</a>
      </div>

      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px;">
        <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.025em;">Résultats</h1>
        <span style="font-size: 12px; font-weight: 600; color: #9a5b00; background: #fdf0dc; border-radius: 999px; padding: 4px 10px;">Chiffres d'exemple</span>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 24px;">
        <div class="kpi"><strong>640</strong><span>contactées sur 1 060</span></div>
        <div class="kpi"><strong>21</strong><span>réponses</span></div>
        <div class="kpi"><strong style="color: #157a40;">9</strong><span>intéressés</span></div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
        <section style="flex: 2 1 300px; min-width: 0; background: #fff; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 18px;">
          <span style="font-size: 15px; font-weight: 600;">Meilleur message</span>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="display: flex; justify-content: space-between; font-size: 14px;"><span style="font-weight: 600;">Version A</span><strong style="font-variant-numeric: tabular-nums;">4,1 %</strong></div>
            <div style="height: 8px; border-radius: 999px; background: #efece6; overflow: hidden;"><div style="width: 82%; height: 100%; background: #3d3dff;"></div></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="display: flex; justify-content: space-between; font-size: 14px; color: #736f6c;"><span>Version B</span><span style="font-variant-numeric: tabular-nums;">2,5 %</span></div>
            <div style="height: 8px; border-radius: 999px; background: #efece6; overflow: hidden;"><div style="width: 50%; height: 100%; background: #b9b9ff;"></div></div>
          </div>
          <a href="Message.dc.html" style="font-size: 14px; font-weight: 600;">Garder seulement la A</a>
        </section>

        <section style="flex: 3 1 440px; min-width: 0; background: #fff; border-radius: 16px; overflow: hidden;">
          <div style="padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 1px solid #f3f0eb;">
            <span style="font-size: 15px; font-weight: 600;">Réponses</span>
            <div class="seg" role="tablist" aria-label="Filtrer les réponses">
              <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
                <button class="{{f.cls}}" onClick="{{f.pick}}" role="tab">{{f.label}}</button>
              </sc-for>
            </div>
          </div>
          <sc-for list="{{replies}}" as="r" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 20px; border-bottom: 1px solid #f3f0eb;">
              <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;">
                <span style="font-weight: 600; font-size: 15px;">{{r.nom}}</span>
                <span class="pill" style="{{r.pillStyle}}">{{r.kindLabel}}</span>
              </div>
              <span style="font-size: 14px; color: #736f6c;">{{r.extrait}}</span>
            </div>
          </sc-for>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  renderVals() {
    const { filter } = this.state;
    const kinds = {
      interested: { label: 'Intéressé', style: 'color: #157a40; background: #e3f5ea;' },
      question: { label: 'Question', style: 'color: #2626d6; background: #e9e9ff;' },
      no: { label: 'Pas intéressé', style: 'color: #736f6c; background: #efece6;' }
    };
    const all = [
      { nom: 'STUDIO 808', kind: 'interested', extrait: 'On refuse souvent des sites faute de dev en interne. On peut s’appeler jeudi ?' },
      { nom: 'Agence FB Communication', kind: 'question', extrait: 'Quels sont vos délais pour un site vitrine de 5 pages ?' },
      { nom: 'Citron Frappé', kind: 'interested', extrait: 'Je cherchais justement quelqu’un pour mes clients qui veulent Webflow.' },
      { nom: '404com', kind: 'no', extrait: 'Merci, nous avons déjà un développeur partenaire.' },
      { nom: 'Studio BIKI', kind: 'interested', extrait: 'Envoyez-moi quelques exemples de sites et vos tarifs.' }
    ];
    const list = filter === 'all' ? all : all.filter((r) => r.kind === filter);
    const f = (key, label) => ({ label, cls: filter === key ? 'on' : '', pick: () => this.setState({ filter: key }) });
    return {
      filters: [f('all', 'Toutes'), f('interested', 'Intéressés'), f('question', 'Questions')],
      replies: list.map((r) => ({ ...r, kindLabel: kinds[r.kind].label, pillStyle: kinds[r.kind].style }))
    };
  }
}
</script>
</body>
</html>
