# Robots LeadMaker sur le serveur (Hetzner). Variables dans un fichier `.env` à côté (voir .env.server.example).
#
#   docker compose up -d --build          # 2 estimations, 1 découverte, 6 préparations / e-mails
#   docker compose --profile send up -d   # + le robot d'envoi (seulement quand Gabriel dit « Envoie »)
#   docker compose logs -f prepare        # suivre un type de robot
#   docker compose down                   # tout arrêter (chaque robot finit sa tâche en cours)

x-robot: &robot
  build: .
  image: leadmaker-worker:${ROBOT_IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  shm_size: 1g                 # Chromium a besoin de mémoire partagée
  stop_grace_period: 3m        # un site en cours est terminé avant l'arrêt
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # Estimations seules : 1 robot, les robots de recherche en font aussi quand ils sont libres.
  estimate:
    <<: *robot
    environment:
      WORKER_KINDS: estimate
    deploy:
      replicas: 1
      resources: { limits: { memory: 1500M } }

  # Recherches Google Maps : 6 en parallèle (chaque robot = une recherche, deux onglets).
  # Demande de Gabriel du 1/11/2026. Surveiller les blocages Google ; chaque robot sort par le proxy.
  discovery:
    <<: *robot
    environment:
      WORKER_KINDS: estimate,discovery
    deploy:
      replicas: 6
      resources: { limits: { memory: 1500M } }

  prepare:
    <<: *robot
    environment:
      WORKER_KINDS: prepare,emails
    deploy:
      replicas: 6
      resources: { limits: { memory: 1500M } }

  # Robot d'envoi : COUPÉ par défaut. Tant qu'il n'est pas lancé, les formulaires validés restent dans « Validés ».
  # Robots d'envoi : SEND_REPLICAS dans le .env du serveur (30 sur le serveur dédié « leadmaker-envoi-1 »).
  send:
    <<: *robot
    profiles: ["send"]
    environment:
      WORKER_KINDS: send
    deploy:
      replicas: ${SEND_REPLICAS:-4}
      resources: { limits: { memory: 1500M } }

  # Surveillant (leadmaker_workers/watchdog.py) : prévient Gabriel par e-mail (Resend) quand les robots
  # n'avancent plus alors qu'il y a du travail. Chaque serveur surveille L'AUTRE : le principal surveille les
  # prises de contact (robots d'envoi), le serveur d'envoi surveille la recherche. Si un serveur meurt
  # entièrement, l'autre le signale. Variables dans .env : RESEND_API_KEY, ALERT_EMAIL (scripts/set-alert-email.sh).
  watch:
    <<: *robot
    command: ["python", "-m", "leadmaker_workers.watchdog"]
    environment:
      WATCH_SCOPE: contact
      WATCH_SERVER: serveur principal
    volumes:
      - watch_state:/app/state
    shm_size: 64m
    deploy:
      resources: { limits: { memory: 256M } }

  watch-send:
    <<: *robot
    profiles: ["send"]
    command: ["python", "-m", "leadmaker_workers.watchdog"]
    environment:
      WATCH_SCOPE: search
      WATCH_SERVER: serveur d'envoi
    volumes:
      - watch_state:/app/state
    shm_size: 64m
    deploy:
      resources: { limits: { memory: 256M } }

volumes:
  watch_state:
